name: docugit
arch: "${ARCH}"
platform: linux
version: "${VERSION}"
section: utils
priority: optional
maintainer: DocuGit <https://github.com/xiaoheiCat/docugit>
description: Git-based version control for Office OpenXML documents
homepage: https://github.com/xiaoheiCat/docugit
license: GPL-3.0

# Placeholders ${VERSION}, ${ARCH}, ${BINARY} are rendered by CI before nfpm runs.
contents:
  - src: ${BINARY}
    dst: /usr/local/bin/docugit
    file_info:
      mode: 0755
