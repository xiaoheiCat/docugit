appId: com.docugit.desktop
productName: DocuGit Desktop
icon: ../assets/icon.png
afterSign: scripts/after-sign-mac.ts
publish:
  provider: github
  owner: xiaoheiCat
  repo: docugit
  releaseType: release
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/bin/
    to: bin/
    filter:
      - "**/*"
  - from: ../assets/icon.png
    to: icon.png
mac:
  category: public.app-category.productivity
  # dmg for manual install; zip required by Squirrel.Mac / electron-updater (cannot auto-update from dmg alone).
  target:
    - dmg
    - zip
  artifactName: docugit-desktop-darwin-${version}-${arch}.${ext}
  # Developer ID builds use hardened runtime; CI ad-hoc passes -c.mac.hardenedRuntime=false.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # docugit + dugite under Contents/Resources/bin (see scripts/after-sign-mac.ts)
  binaries:
    - Contents/Resources/bin/docugit
dmg:
  writeUpdateInfo: true
win:
  target:
    - nsis
  artifactName: docugit-desktop-windows-${version}-${arch}.${ext}
  icon: ../assets/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Differential NSIS updates can uninstall the old build then fail to apply the
  # patch, leaving only Uninstall.exe in the install directory (electron-builder #9181).
  differentialPackage: false
