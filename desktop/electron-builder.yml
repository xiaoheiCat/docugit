appId: com.docugit.desktop
productName: DocuGit Desktop
icon: ../assets/icon.png
publish:
  provider: github
  owner: xiaoheiCat
  repo: docugit
  releaseType: release
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/bin/
    to: bin/
    filter:
      - "**/*"
  - from: ../assets/icon.png
    to: icon.png
mac:
  category: public.app-category.productivity
  target:
    - dmg
  artifactName: docugit-desktop-darwin-${version}-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
dmg:
  writeUpdateInfo: true
win:
  target:
    - nsis
  artifactName: docugit-desktop-windows-${version}-${arch}.${ext}
  icon: ../assets/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  differentialPackage: true
