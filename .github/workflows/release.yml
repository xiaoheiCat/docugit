name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - Formula/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.version.outputs.version_tag }}
      pkg_version: ${{ steps.version.outputs.pkg_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: version
        run: |
          SHORT_SHA="$(git rev-parse --short=6 HEAD)"
          DATE_TIME="$(date -u +%Y.%m.%d_%H.%M.%S)"
          VERSION="v${DATE_TIME}_${SHORT_SHA}"
          PKG_VERSION="${DATE_TIME}_${SHORT_SHA}"
          echo "version_tag=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "pkg_version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "DocuGit version: ${VERSION}"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: ubuntu-latest
            target: bun-linux-x64
            artifact: docugit-linux-amd64
            ext: ""
            arch: amd64
          - os: linux-arm64
            runner: ubuntu-24.04-arm
            target: bun-linux-arm64
            artifact: docugit-linux-arm64
            ext: ""
            arch: arm64
          - os: macos-amd64
            runner: macos-15-intel
            target: bun-darwin-x64
            artifact: docugit-darwin-amd64
            ext: ""
            arch: amd64
          - os: macos-arm64
            runner: macos-latest
            target: bun-darwin-arm64
            artifact: docugit-darwin-arm64
            ext: ""
            arch: arm64
          - os: windows-amd64
            runner: windows-latest
            target: bun-windows-x64
            artifact: docugit-windows-amd64
            ext: ".exe"
            arch: amd64
          - os: windows-arm64
            runner: windows-11-arm
            target: bun-windows-arm64
            artifact: docugit-windows-arm64
            ext: ".exe"
            arch: arm64

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare Windows executable icon
        if: matrix.ext == '.exe'
        shell: pwsh
        run: ./scripts/prepare-windows-icon.ps1

      - name: Build binary
        shell: bash
        env:
          DOCUGIT_VERSION: ${{ needs.prepare.outputs.version_tag }}
        run: |
          set -euo pipefail
          bun run embed-templates
          if [ "${{ matrix.ext }}" = ".exe" ]; then
            bun build src/cli/index.ts --compile \
              --target=${{ matrix.target }} \
              --define "process.env.DOCUGIT_VERSION=\"${DOCUGIT_VERSION}\"" \
              --windows-icon=assets/icon.ico \
              --outfile "dist/${{ matrix.artifact }}${{ matrix.ext }}"
          else
            bun build src/cli/index.ts --compile \
              --target=${{ matrix.target }} \
              --define "process.env.DOCUGIT_VERSION=\"${DOCUGIT_VERSION}\"" \
              --outfile "dist/${{ matrix.artifact }}${{ matrix.ext }}"
          fi

      - name: Install WiX Toolset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candle = Join-Path ${env:ProgramFiles(x86)} 'WiX Toolset v3.14\bin\candle.exe'
          if (-not (Test-Path $candle)) {
            choco install wixtoolset --version=3.14.1.20250415 -y --no-progress
          }
          if (-not (Test-Path $candle)) {
            throw 'WiX Toolset 3.14 not found after install'
          }

      - name: Build MSI
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PKG_VERSION: ${{ needs.prepare.outputs.pkg_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $wixArch = if ('${{ matrix.arch }}' -eq 'amd64') { 'x64' } else { 'arm64' }
          $outMsi = "dist/docugit-$env:PKG_VERSION-${{ matrix.arch }}.msi"
          ./scripts/build-msi.ps1 `
            -Arch $wixArch `
            -Binary "dist/${{ matrix.artifact }}${{ matrix.ext }}" `
            -Version $env:PKG_VERSION `
            -OutMsi $outMsi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}${{ matrix.ext }}

      - name: Upload MSI
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: docugit-msi-${{ matrix.arch }}
          path: dist/docugit-*.msi

  desktop:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            docugit_bin: docugit-darwin-arm64
            electron_arch: arm64
          - os: macos-15-intel
            platform: darwin
            docugit_bin: docugit-darwin-amd64
            electron_arch: x64
          - os: windows-latest
            platform: windows
            docugit_bin: docugit-windows-amd64.exe
            electron_arch: x64
          - os: windows-11-arm
            platform: windows
            docugit_bin: docugit-windows-arm64.exe
            electron_arch: arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install CLI dependencies
        run: bun install --frozen-lockfile

      - name: Prepare Windows executable icon
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/prepare-windows-icon.ps1

      - name: Build docugit binary for desktop
        shell: bash
        env:
          DOCUGIT_VERSION: ${{ needs.prepare.outputs.version_tag }}
        run: |
          set -euo pipefail
          case "${{ matrix.os }}" in
            macos-latest) target=bun-darwin-arm64 ;;
            macos-15-intel) target=bun-darwin-x64 ;;
            windows-latest) target=bun-windows-x64 ;;
            windows-11-arm) target=bun-windows-arm64 ;;
          esac
          bun run embed-templates
          if [ "${{ matrix.platform }}" = "windows" ]; then
            bun build src/cli/index.ts --compile \
              --target=$target \
              --define "process.env.DOCUGIT_VERSION=\"${DOCUGIT_VERSION}\"" \
              --windows-icon=assets/icon.ico \
              --outfile "dist/${{ matrix.docugit_bin }}"
          else
            bun build src/cli/index.ts --compile \
              --target=$target \
              --define "process.env.DOCUGIT_VERSION=\"${DOCUGIT_VERSION}\"" \
              --outfile "dist/${{ matrix.docugit_bin }}"
          fi

      - name: Stage docugit for electron-builder
        shell: bash
        run: |
          mkdir -p desktop/resources/bin
          cp "dist/${{ matrix.docugit_bin }}" "desktop/resources/bin/docugit${{ matrix.platform == 'windows' && '.exe' || '' }}"

      - name: Stage bundled Git
        shell: bash
        run: |
          set -euo pipefail
          cd desktop
          platform="darwin"
          if [ "${{ matrix.platform }}" = "windows" ]; then
            platform="win32"
          fi
          bun run scripts/stage-bundled-git.ts --platform "$platform" --arch "${{ matrix.electron_arch }}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build DocuGit Desktop
        shell: bash
        env:
          DOCUGIT_DESKTOP_VERSION: ${{ needs.prepare.outputs.pkg_version }}
        run: |
          cd desktop
          bun install
          bun run build
          DESKTOP_SEMVER="$(bun run scripts/pkg-version-to-semver.ts "${DOCUGIT_DESKTOP_VERSION}")"
          if [ "${{ matrix.platform }}" = "windows" ]; then
            npx electron-builder --config electron-builder.yml --win --${{ matrix.electron_arch }} --publish never \
              -c.extraMetadata.version="${DESKTOP_SEMVER}"
          else
            npx electron-builder --config electron-builder.yml --mac --${{ matrix.electron_arch }} --publish never \
              -c.extraMetadata.version="${DESKTOP_SEMVER}"
          fi

      - name: Stage desktop installers
        shell: bash
        run: |
          mkdir -p desktop/release/upload
          find desktop/release -maxdepth 1 -type f \( \
            -name '*.dmg' -o -name '*.exe' -o -name '*.blockmap' -o -name 'latest*.yml' \
          \) -exec cp {} desktop/release/upload/ \;
          ls -la desktop/release/upload/

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: docugit-desktop-${{ matrix.platform }}-${{ matrix.electron_arch }}
          path: desktop/release/upload/*

  package:
    needs: [prepare, build, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist/bin

      - name: Download MSI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: docugit-msi-*
          path: dist/msi
          merge-multiple: true

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: docugit-desktop-*
          path: dist/desktop
          merge-multiple: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install desktop dependencies for update metadata merge
        run: bun install --frozen-lockfile
        working-directory: desktop

      - name: Flatten artifacts
        run: |
          set -euo pipefail
          mkdir -p release/bin release/install release/desktop
          # Artifact download drops the executable bit on Unix binaries; do not rely on -executable.
          find dist/bin -mindepth 2 -type f -exec cp {} release/bin/ \;
          find release/bin -type f ! -name '*.exe' -exec chmod +x {} +
          find dist/msi -name '*.msi' -exec cp {} release/install/ \; 2>/dev/null || true
          find dist/desktop -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.blockmap' \) -exec cp {} release/desktop/ \; 2>/dev/null || true
          idx=0
          while IFS= read -r f; do
            cp "$f" "release/desktop/latest-mac-${idx}.yml"
            idx=$((idx + 1))
          done < <(find dist/desktop -name 'latest-mac.yml' | sort)
          idx=0
          while IFS= read -r f; do
            cp "$f" "release/desktop/latest-win-${idx}.yml"
            idx=$((idx + 1))
          done < <(find dist/desktop -name 'latest.yml' | sort)
          (cd desktop && bun run scripts/merge-update-metadata.ts ../release/desktop)
          ls -la release/bin/
          ls -la release/install/ || true
          ls -la release/desktop/ || true

      - name: Install nfpm
        run: |
          echo "deb [trusted=yes] https://apt.fury.io/goreleaser/ /" | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm

      - name: Build deb packages
        env:
          PKG_VERSION: ${{ needs.prepare.outputs.pkg_version }}
        run: |
          set -euo pipefail
          built=0
          deb_version="$(echo "$PKG_VERSION" | tr '_' '-')"
          for pair in "docugit-linux-amd64:amd64" "docugit-linux-arm64:arm64"; do
            bin="${pair%%:*}"
            arch="${pair##*:}"
            if [ -f "release/bin/$bin" ]; then
              sed -e "s|\${VERSION}|${deb_version}|g" \
                  -e "s|\${ARCH}|${arch}|g" \
                  -e "s|\${BINARY}|release/bin/${bin}|g" \
                packaging/deb/nfpm.yaml > "/tmp/nfpm-${arch}.yaml"
              nfpm pkg --config "/tmp/nfpm-${arch}.yaml" \
                --packager deb \
                --target "release/install/docugit_${PKG_VERSION}_${arch}.deb"
              built=$((built + 1))
            fi
          done
          if [ "$built" -eq 0 ]; then
            echo "error: no Linux binaries found in release/bin; deb packages were not built" >&2
            exit 1
          fi

      - name: Build Homebrew formula
        env:
          PKG_VERSION: ${{ needs.prepare.outputs.pkg_version }}
          VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
        run: |
          set -euo pipefail
          mkdir -p Formula
          test -f release/bin/docugit-darwin-arm64
          test -f release/bin/docugit-darwin-amd64
          test -f release/bin/docugit-linux-amd64
          test -f release/bin/docugit-linux-arm64
          SHA_DARWIN_ARM64=$(sha256sum release/bin/docugit-darwin-arm64 | awk '{print $1}')
          SHA_DARWIN_AMD64=$(sha256sum release/bin/docugit-darwin-amd64 | awk '{print $1}')
          SHA_LINUX_AMD64=$(sha256sum release/bin/docugit-linux-amd64 | awk '{print $1}')
          SHA_LINUX_ARM64=$(sha256sum release/bin/docugit-linux-arm64 | awk '{print $1}')
          sed -e "s/@VERSION@/${PKG_VERSION}/g" \
              -e "s/@VERSION_TAG@/${VERSION_TAG}/g" \
              -e "s/@SHA256_DARWIN_ARM64@/${SHA_DARWIN_ARM64}/g" \
              -e "s/@SHA256_DARWIN_AMD64@/${SHA_DARWIN_AMD64}/g" \
              -e "s/@SHA256_LINUX_AMD64@/${SHA_LINUX_AMD64}/g" \
              -e "s/@SHA256_LINUX_ARM64@/${SHA_LINUX_ARM64}/g" \
            packaging/homebrew/docugit.rb.template > Formula/docugit.rb

      - name: Stage release uploads
        run: |
          set -euo pipefail
          mkdir -p release/upload
          shopt -s nullglob
          for pattern in \
            "release/bin/*" \
            "release/install/*" \
            "release/desktop/*.dmg" \
            "release/desktop/*.exe" \
            "release/desktop/*.blockmap" \
            "release/desktop/latest*.yml"; do
            for file in $pattern; do
              cp "$file" "release/upload/$(basename "$file")"
            done
          done
          ls -la release/upload/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version_tag }}
          name: ${{ needs.prepare.outputs.version_tag }}
          generate_release_notes: true
          overwrite_files: false
          files: release/upload/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Homebrew formula
        env:
          VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/docugit.rb
          git diff --staged --quiet && exit 0
          git commit -m "chore: update Homebrew formula for ${VERSION_TAG}"
          git push
