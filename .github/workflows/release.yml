name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - Formula/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.version.outputs.version_tag }}
      pkg_version: ${{ steps.version.outputs.pkg_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: version
        run: |
          SHORT_SHA="$(git rev-parse --short=6 HEAD)"
          DATE_TIME="$(date -u +%Y.%m.%d_%H.%M.%S)"
          VERSION="v${DATE_TIME}_${SHORT_SHA}"
          PKG_VERSION="${DATE_TIME}_${SHORT_SHA}"
          echo "version_tag=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "pkg_version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "DocuGit version: ${VERSION}"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: ubuntu-latest
            target: bun-linux-x64
            artifact: docugit-linux-amd64
            ext: ""
            arch: amd64
          - os: linux-arm64
            runner: ubuntu-24.04-arm
            target: bun-linux-arm64
            artifact: docugit-linux-arm64
            ext: ""
            arch: arm64
          - os: macos-amd64
            runner: macos-15-intel
            target: bun-darwin-x64
            artifact: docugit-darwin-amd64
            ext: ""
            arch: amd64
          - os: macos-arm64
            runner: macos-latest
            target: bun-darwin-arm64
            artifact: docugit-darwin-arm64
            ext: ""
            arch: arm64
          - os: windows-amd64
            runner: windows-latest
            target: bun-windows-x64
            artifact: docugit-windows-amd64
            ext: ".exe"
            arch: amd64
          - os: windows-arm64
            runner: windows-11-arm
            target: bun-windows-arm64
            artifact: docugit-windows-arm64
            ext: ".exe"
            arch: arm64

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binary
        shell: bash
        env:
          DOCUGIT_VERSION: ${{ needs.prepare.outputs.version_tag }}
        run: >
          bun run embed-templates &&
          bun build src/cli/index.ts --compile
          --target=${{ matrix.target }}
          --define "process.env.DOCUGIT_VERSION=\"${DOCUGIT_VERSION}\""
          --outfile dist/${{ matrix.artifact }}${{ matrix.ext }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}${{ matrix.ext }}

  package:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist/bin

      - name: Flatten artifacts
        run: |
          mkdir -p release/bin release/install
          # Artifact download drops the executable bit on Unix binaries; do not rely on -executable.
          find dist/bin -mindepth 2 -type f -exec cp {} release/bin/ \;
          find release/bin -type f ! -name '*.exe' -exec chmod +x {} +
          ls -la release/bin/

      - name: Install nfpm
        run: |
          echo "deb [trusted=yes] https://apt.fury.io/goreleaser/ /" | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm

      - name: Build deb packages
        env:
          PKG_VERSION: ${{ needs.prepare.outputs.pkg_version }}
        run: |
          set -euo pipefail
          built=0
          deb_version="$(echo "$PKG_VERSION" | tr '_' '-')"
          for pair in "docugit-linux-amd64:amd64" "docugit-linux-arm64:arm64"; do
            bin="${pair%%:*}"
            arch="${pair##*:}"
            if [ -f "release/bin/$bin" ]; then
              sed -e "s|\${VERSION}|${deb_version}|g" \
                  -e "s|\${ARCH}|${arch}|g" \
                  -e "s|\${BINARY}|release/bin/${bin}|g" \
                packaging/deb/nfpm.yaml > "/tmp/nfpm-${arch}.yaml"
              nfpm pkg --config "/tmp/nfpm-${arch}.yaml" \
                --packager deb \
                --target "release/install/docugit_${PKG_VERSION}_${arch}.deb"
              built=$((built + 1))
            fi
          done
          if [ "$built" -eq 0 ]; then
            echo "error: no Linux binaries found in release/bin; deb packages were not built" >&2
            exit 1
          fi

      - name: Build Homebrew formula
        env:
          PKG_VERSION: ${{ needs.prepare.outputs.pkg_version }}
          VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
        run: |
          set -euo pipefail
          mkdir -p Formula
          test -f release/bin/docugit-darwin-arm64
          test -f release/bin/docugit-darwin-amd64
          test -f release/bin/docugit-linux-amd64
          test -f release/bin/docugit-linux-arm64
          SHA_DARWIN_ARM64=$(sha256sum release/bin/docugit-darwin-arm64 | awk '{print $1}')
          SHA_DARWIN_AMD64=$(sha256sum release/bin/docugit-darwin-amd64 | awk '{print $1}')
          SHA_LINUX_AMD64=$(sha256sum release/bin/docugit-linux-amd64 | awk '{print $1}')
          SHA_LINUX_ARM64=$(sha256sum release/bin/docugit-linux-arm64 | awk '{print $1}')
          sed -e "s/@VERSION@/${PKG_VERSION}/g" \
              -e "s/@VERSION_TAG@/${VERSION_TAG}/g" \
              -e "s/@SHA256_DARWIN_ARM64@/${SHA_DARWIN_ARM64}/g" \
              -e "s/@SHA256_DARWIN_AMD64@/${SHA_DARWIN_AMD64}/g" \
              -e "s/@SHA256_LINUX_AMD64@/${SHA_LINUX_AMD64}/g" \
              -e "s/@SHA256_LINUX_ARM64@/${SHA_LINUX_ARM64}/g" \
            packaging/homebrew/docugit.rb.template > Formula/docugit.rb

      - name: Build MSI (linux via wixl)
        env:
          PKG_VERSION: ${{ needs.prepare.outputs.pkg_version }}
        run: |
          sudo apt-get install -y wixl wixl-data
          MSI_VERSION="$(echo "$PKG_VERSION" | tr '_' '.')"
          for pair in "docugit-windows-amd64:amd64" "docugit-windows-arm64:arm64"; do
            bin="${pair%%:*}"
            arch="${pair##*:}"
            if [ -f "release/bin/${bin}.exe" ]; then
              sed -e "s/@VERSION@/${MSI_VERSION}/g" \
                  -e "s/@ARCH@/$arch/g" \
                  -e "s|@BINARY@|release/bin/${bin}.exe|g" \
                packaging/msi/docugit.wxs.template > /tmp/docugit.wxs
              wixl -o "release/install/docugit-${PKG_VERSION}-${arch}.msi" /tmp/docugit.wxs
            fi
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version_tag }}
          name: ${{ needs.prepare.outputs.version_tag }}
          generate_release_notes: true
          files: |
            release/bin/*
            release/install/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Homebrew formula
        env:
          VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/docugit.rb
          git diff --staged --quiet && exit 0
          git commit -m "chore: update Homebrew formula for ${VERSION_TAG}"
          git push
